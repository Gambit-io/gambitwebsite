<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Factory Floor · The Bogan Factory · Gambit</title>
<meta name="description" content="The factory floor: every signal moving from a filing to a first conversation, at scale.">

<link rel="icon" type="image/png" href="/img/favicon.png">

<style>
@import url('https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap');

:root{
  --navy:#0b1626;--ink:#15110d;--ink-2:#241f1a;--paper:#ffffff;--bone:#f5f1ea;
  --line-card:#e5ddd0;--line-2:#efeae1;--muted:#6f675c;--muted-2:#8a8175;
  --accent:#dc4530;--accent-2:#f2836f;--accent-deep:#b23a26;--status:#3ec46d;--status-d:#1f9e54;
  --mut:rgba(233,238,247,.74);--mut-2:rgba(233,238,247,.52);--line:rgba(255,255,255,.12);--line-b:rgba(255,255,255,.2);
  --display:'General Sans','Helvetica Neue',Arial,sans-serif;--mark:'Orbitron',sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;
  --ease:cubic-bezier(.16,1,.3,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--display);color:#fff;background:radial-gradient(120% 90% at 50% -10%,rgba(220,69,48,.08),transparent 50%),#070f1c;-webkit-font-smoothing:antialiased;overflow:hidden}
a{color:inherit;text-decoration:none}

.app{height:100vh;display:flex;flex-direction:column}

/* header */
.appbar{display:flex;align-items:center;gap:16px;padding:14px 24px;border-bottom:1px solid var(--line);flex:none}
.appbar .logo{height:16px;width:auto;filter:brightness(0) invert(1);opacity:.75}
.appbar .div{width:1px;height:20px;background:var(--line)}
.appbar .title{font-family:var(--mono);font-size:13px;letter-spacing:.04em;color:#eaf0f8}
.appbar .backlink{margin-left:auto;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--mut);border:1px solid var(--line-b);border-radius:20px;padding:6px 13px;transition:color .2s,border-color .2s,background .2s}
.appbar .backlink:hover{color:#fff;border-color:rgba(255,255,255,.4);background:rgba(255,255,255,.06)}
.appbar .live{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#7fd4a4}
.appbar .live .d{width:7px;height:7px;border-radius:50%;background:var(--status);animation:pulse 2s infinite}
.appbar .worker{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut-2);border:1px solid var(--line);border-radius:20px;padding:5px 11px}
.appbar .worker .b{width:16px;height:16px;border-radius:5px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-family:var(--mark);font-weight:700;font-size:8px;color:#fff}

/* mandate strip */
.mandate{display:flex;align-items:center;gap:14px;padding:12px 24px;border-bottom:1px solid var(--line);flex:none;background:rgba(255,255,255,.015)}
.mandate .lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent-2);flex:none}
.mandate .val{font-family:var(--mono);font-size:12.5px;color:#dfe6f0;letter-spacing:.01em}
@media(max-width:720px){.mandate .val{font-size:11px}}

/* kpi row */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;padding:16px 24px;flex:none}
.kpi{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.kpi .n{font-family:var(--display);font-weight:600;font-size:26px;letter-spacing:-.02em;color:#fff;line-height:1}
.kpi .l{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut-2);margin-top:7px}
.kpi .n .u{color:var(--accent-2);font-size:15px;margin-left:3px;font-weight:600}
@media(max-width:720px){.kpis{grid-template-columns:repeat(3,1fr)}}

/* board */
.board{flex:1;min-height:0;margin:4px 16px 16px;background:var(--bone);border-radius:16px;box-shadow:0 40px 90px -50px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.06);padding:16px;display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
@media(max-width:900px){.board{grid-template-columns:repeat(3,1fr);overflow-y:auto}}
.bcol{background:#fff;border:1px solid var(--line-2);border-radius:12px;padding:11px 10px;display:flex;flex-direction:column;gap:8px;min-height:0}
.bcol-h{display:flex;align-items:center;justify-content:space-between;font-family:var(--mono);font-size:9px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted-2);padding-bottom:8px;border-bottom:1px solid var(--line-2)}
.bcol-h .cnt{color:var(--ink-2);font-weight:600;background:var(--bone);border:1px solid var(--line-2);border-radius:10px;padding:1px 8px}
.bcards{display:flex;flex-direction:column;gap:8px;overflow:hidden;flex:1}
.bcard{background:#fff;border:1px solid var(--line-card);border-radius:9px;padding:9px 11px;box-shadow:0 5px 12px -10px rgba(0,0,0,.5);transition:opacity .3s var(--ease),transform .3s var(--ease)}
.bcard.you{border-color:var(--accent);box-shadow:0 0 0 1.5px var(--accent)}
.bcard.leaving{opacity:0;transform:translateX(26px)}
.bcard.entering{animation:cardEnter .4s var(--ease)}
@keyframes cardEnter{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
.bcard .co{font-size:12px;font-weight:600;color:var(--ink-2);letter-spacing:-.01em;line-height:1.25;display:flex;align-items:center;gap:6px}
.bcard .co .tag{font-family:var(--mono);font-size:7px;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:var(--accent);border-radius:20px;padding:1px 6px}
.bcard .sec{font-family:var(--mono);font-size:8px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted-2);margin-top:3px}
.bcard .meta{display:flex;align-items:center;justify-content:space-between;margin-top:7px;gap:8px}
.bcard .fit{font-family:var(--mono);font-size:9px;font-weight:600;color:var(--accent-deep);background:rgba(220,69,48,.09);border-radius:5px;padding:2px 6px}
.bcard .agent{font-family:var(--mono);font-size:8px;letter-spacing:.03em;color:var(--muted-2);display:inline-flex;align-items:center;gap:4px}
.bcard .agent .dot{width:5px;height:5px;border-radius:50%;background:var(--status)}
.bmore{font-family:var(--mono);font-size:8.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted-2);text-align:center;padding:4px 0 1px;margin-top:auto}

@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(62,196,109,.5)}70%{box-shadow:0 0 0 6px rgba(62,196,109,0)}100%{box-shadow:0 0 0 0 rgba(62,196,109,0)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="appbar">
    <img class="logo" src="/img/gambit-logo.png" alt="Gambit">
    <span class="div"></span>
    <span class="title">Bogan &middot; buy-side worker</span>
    <a class="backlink" href="/the-bogan-factory">&larr; The Bogan Factory</a>
    <span class="live"><span class="d"></span> Live</span>
  </div>

  <div class="mandate">
    <span class="lbl">Mandate</span>
    <span class="val">Founder-owned industrials &middot; $3 to 8M EBITDA &middot; ownership change filed in the last 90 days</span>
  </div>

  <div class="kpis">
    <div class="kpi"><div class="n" id="kPipe">51</div><div class="l">In pipeline</div></div>
    <div class="kpi"><div class="n" id="kRes">11</div><div class="l">In research</div></div>
    <div class="kpi"><div class="n" id="kDraft">14</div><div class="l">Drafted today</div></div>
    <div class="kpi"><div class="n" id="kSent">128</div><div class="l">Sent</div></div>
    <div class="kpi"><div class="n" id="kReply">19<span class="u">&nbsp;replies</span></div><div class="l">In conversation</div></div>
  </div>

  <div class="board" id="board"></div>
</div>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var MAXV = 4;
  var STAGES = ['New signal','Researching','Scored','Drafting','Queued','Sent'];
  var AGENTS = ['Scraper','Researcher','Scorer','Bogan','Sender','Bogan'];

  var cols = [
    { total:23, cards:[ {co:'Cedar Mfg.',trig:'Ownership change'},{co:'Delta Tool & Die',trig:'Succession filed'},{co:'Ironwood Casting',trig:'Ownership change'},{co:'Meridian Stamping',trig:'Retirement signal'} ]},
    { total:11, cards:[ {co:'Vantage Metalworks'},{co:'Orizon Industrial'},{co:'Calder Machine'},{co:'Bluepeak Fab'} ]},
    { total:7,  cards:[ {co:'Harbor Castings',fit:82},{co:'Pike Fabrication',fit:74},{co:'Granite Components',fit:69},{co:'Novak Welding',fit:77} ]},
    { total:4,  cards:[ {co:'Atlas Fabrication',fit:87,you:true},{co:'Sterling Diecast',fit:81},{co:'Redmond Tool',fit:76} ]},
    { total:6,  cards:[ {co:'Ridgeline Machining',fit:79},{co:'Kestrel Industrial',fit:84},{co:'Foxhill Fab',fit:72} ]},
    { total:128,cards:[ {co:'Summit Forge',fit:88},{co:'Cross Valve Co.',fit:81},{co:'Halden Metalworks',fit:85},{co:'Pillar Manufacturing',fit:79} ]}
  ];

  // fictional company generator (no real names)
  var PRE=['Cedar','Delta','Vantage','Orizon','Harbor','Pike','Granite','Novak','Sterling','Redmond','Ridgeline','Kestrel','Foxhill','Summit','Halden','Pillar','Ironwood','Meridian','Calder','Bluepeak','Ashford','Beacon','Copperline','Drayton','Elkhorn','Fairmont','Gorman','Hollis','Marlow','Tamworth','Weston','Aldridge'];
  var SUF=['Mfg.','Tool & Die','Metalworks','Industrial','Castings','Fabrication','Machining','Forge','Stamping','Welding','Components','Diecast','Foundry','Ironworks'];
  var TRIG=['Ownership change','Succession filed','Retirement signal','Recapitalization','Owner exit'];
  function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
  function mint(stage){ var c={ co: pick(PRE)+' '+pick(SUF), trig: pick(TRIG) }; if(stage>=2) c.fit=68+Math.floor(Math.random()*23); return c; }

  var board=$('board'); board.innerHTML='';
  var colEls=[];
  STAGES.forEach(function(name){
    var el=document.createElement('div'); el.className='bcol';
    el.innerHTML='<div class="bcol-h"><span>'+name+'</span><span class="cnt"></span></div><div class="bcards"></div><div class="bmore"></div>';
    board.appendChild(el);
    colEls.push({ cnt:el.querySelector('.cnt'), cards:el.querySelector('.bcards'), more:el.querySelector('.bmore') });
  });

  function cardEl(c, stage){
    var el=document.createElement('div');
    el.className='bcard'+(c.you?' you':'');
    var fit=(c.fit!=null)?'<span class="fit">fit '+c.fit+'</span>':'<span></span>';
    var tag=c.you?'<span class="tag">tracking</span>':'';
    var sec=(stage===0)?(c.trig||'Signal'):'Industrials';
    el.innerHTML='<div class="co">'+c.co+tag+'</div><div class="sec">'+sec+'</div>'+
      '<div class="meta">'+fit+'<span class="agent"><span class="dot"></span>'+AGENTS[stage]+'</span></div>';
    return el;
  }
  function syncMeta(i){ var col=cols[i], ce=colEls[i]; ce.cnt.textContent=col.total; var extra=col.total-col.cards.length; ce.more.textContent = extra>0 ? ('+'+extra+' more') : ''; }
  function renderCol(i){ var col=cols[i], ce=colEls[i]; ce.cards.innerHTML=''; col.cards.slice(0,MAXV).forEach(function(c){ ce.cards.appendChild(cardEl(c,i)); }); syncMeta(i); }
  cols.forEach(function(_,i){ renderCol(i); });

  var drafted=14, replies=19;
  function recalcKPIs(){ var pipe=0; for(var i=0;i<5;i++) pipe+=cols[i].total; $('kPipe').textContent=pipe; $('kRes').textContent=cols[1].total; $('kSent').textContent=cols[5].total; }
  recalcKPIs();

  if(RM) return; // reduced motion: leave the board static

  function capNodes(ce){ while(ce.cards.children.length>MAXV){ ce.cards.removeChild(ce.cards.lastChild); } }

  function advance(){
    // move one card forward from a random stage that has a visible card
    var cand=[]; for(var s=0;s<5;s++){ if(cols[s].cards.length>0) cand.push(s); }
    if(cand.length){
      var s=cand[Math.floor(Math.random()*cand.length)];
      var src=cols[s], dst=cols[s+1], srcEl=colEls[s], dstEl=colEls[s+1];
      var card=src.cards.pop();
      src.total=Math.max(0, src.total-1);
      var outNode=srcEl.cards.children[srcEl.cards.children.length-1];
      if(outNode){
        outNode.classList.add('leaving');
        setTimeout(function(){
          if(outNode.parentNode) outNode.parentNode.removeChild(outNode);
          if(src.cards.length<MAXV && src.total>src.cards.length){ var f=mint(s); src.cards.push(f); var fn=cardEl(f,s); fn.classList.add('entering'); srcEl.cards.appendChild(fn); }
          syncMeta(s);
        }, 330);
      } else { syncMeta(s); }
      // into next stage (assign fit when it reaches Scored)
      if(s+1===2 && card.fit==null) card.fit=68+Math.floor(Math.random()*23);
      dst.cards.unshift(card); if(dst.cards.length>MAXV) dst.cards.pop();
      dst.total+=1;
      if(s+1===3){ drafted++; $('kDraft').textContent=drafted; }
      if(s+1===5 && Math.random()<0.5){ replies++; $('kReply').childNodes[0].textContent=replies; }
      var dn=cardEl(card,s+1); dn.classList.add('entering');
      dstEl.cards.insertBefore(dn, dstEl.cards.firstChild); capNodes(dstEl);
      syncMeta(s+1);
    }
    // occasional new signal in (bounded so the first column doesn't balloon)
    if(Math.random()<0.45 && cols[0].total<38){
      var c0=cols[0], e0=colEls[0]; c0.total+=1;
      if(c0.cards.length<MAXV){ var nc=mint(0); c0.cards.unshift(nc); var nn=cardEl(nc,0); nn.classList.add('entering'); e0.cards.insertBefore(nn,e0.cards.firstChild); capNodes(e0); }
      syncMeta(0);
    }
    recalcKPIs();
  }
  setInterval(advance, 2100);
})();
</script>
</body>
</html>
